      <!--formulaire de don-->

        <section class="dons">
    <h1>Faites un don pour le meilleur contenu BD !</h1>

    <form onsubmit="faireUnDon(event)" id="donation-form">
        <input
            type="number"
            id="montant"
            value="10"
            min="1"
            placeholder="Montant du don (€)"
            required
        >

        <button type="submit">Faire un don</button>
    </form>

    <p>Total récolté : <span id="total">0</span> € / 1800 €</p>
    <p>Il reste : <span id="restant">1800</span> € à atteindre</p>
    <p>Nombre de dons : <span id="nbDons">0</span></p>

    <button onclick="reinitialisercaniote()">
      reinitialiser le montant
    </button>
</section>

      <section>
        
        <section>
          <h2>
            Ajouter une création
          </h2>

          <form
            id="formulaire-BD"
            onsubmit="ajouterBD(event)"
          >
            <label>
              Titre
              <input type="text" id="champ-titre", placeholder="sale gosse", oninput="verifierSaisieTitre(this)" required/>
            </label>
            <label>
              version
              <input type="text" id="champ-version" placeholder="basique" required/>
            </label>
              <label>
                Année
                <input type="number" id="champ-annee" placeholder="2027" required />
              </label>
              <label>
                Prix (€)
                <input type="number" step="0.01"  id="champ-prix"  placeholder="25.99" required
                />
              </label>
              <label>
                nb pages
                <input type="number" id="champ-page"  placeholder="400" required
                />
              </label>
              <label>
                
                <input type="file" id="champ-image"  placeholder="img\crrusta-soi.png" required
                />
              </label>
            

            <button
              type="submit"
              >
              Ajouter au catalogue
            </button>
          </form>
        </section>
        <section id="catalogue"></section>
