<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma vente de bd</title>
    <script src="js/scrpt.js" defer></script>
  </head>
<body>
    <header>
        <nav>
            <a href=""></a>
        </nav>
        <h1>bienvenue sur le site</h1>
    </header>
    <main>
        <section class = base site >
            <h2>le site numero 1 de vente de bande dessinée</h2>
                <p></p>
        <form onssubmit="modifierbase(); return false;"
          id="formulaire-de-bd"
          onsubmit="modifierbase(event)">
            
        
          <input 
            type="text" id="nom" value="sale-gosse" placeholder="Titre" required/>
          <input
            type="text" id="auteur" value="tekenarr" placeholder="Auteur" required/>
          <input
            type="number" id="annee"  value="2026" placeholder="Année" required/>
          <input
            type="number" id="prix" value="15.00" step="0.01"  placeholder="Prix (€)" required/>

          <button>
            
            Mettre à jour la carte
          </button>
        </form>
        </section>

        <section class = carte >
            <h2>resultat</h2>
                <p id = nom-zone>a</p>
                <p id = auteur-zone>b</p>
                <p id = annee-zone>c</p>
                <p id = prix-zone>d</p>
                
        </section>
    </main>
    <footer></footer>
</body>
</html>
